# IKEA Health Check Configuration
# ================================

[MONITORING]
# Interval between health checks (in seconds)
# NOTE: Set to 60 seconds (1 minute) for testing. Change to 300 for production (5 minutes)
check_interval = 30

# Quick check interval for failed URLs (in seconds)
quick_check_interval = 30

# Request timeout (in seconds)
request_timeout = 10

# RETRY THRESHOLD: Number of consecutive failures before triggering alert email
# IMPORTANT: Email is sent ONLY when BOTH conditions are met:
#   1. consecutive_failures >= alert_threshold (default: 3)
#   2. email_enabled = true (see EMAIL_ALERTS section below)
# 
# FAILURE PROGRESSION:
#   Failure 1 -> Logged (no email)
#   Failure 2 -> Logged (no email)
#   Failure 3 -> Threshold reached -> Email sent (if email_enabled = true) or logged only (if false)
#   Recovery  -> Recovery email sent (if email_enabled = true)
#
# This ensures emails are sent ONLY for real issues, preventing alert fatigue.
alert_threshold = 3

[LOGGING]
# Directory for log files
log_directory = logs

# Main log file name
log_file = health_check.log

# Alert log file name
alert_log_file = health_check_alerts.log

# Report file name
report_file = health_check_report.json

[EMAIL_ALERTS]
# Enable email notifications (true/false)
# IMPORTANT: Set to true to enable email alerts. When enabled:
#   - Alert emails are sent when a URL fails alert_threshold times consecutively
#   - Recovery emails are sent when a previously-failed URL comes back online
#   - NO emails are sent at fixed intervals - only when failures/recoveries occur
#   - This prevents unnecessary inbox notifications during normal operation
# Set to false to disable all email notifications (alerts still logged locally)
enabled = true

# SMTP server configuration
smtp_server = smtp.gmail.com
smtp_port = 587

# Sender email
sender_email = your_email@gmail.com

# Sender email password or app password
sender_password = your_app_password

# Recipient emails (comma-separated)
recipient_emails = admin@ikea.com,ops@ikea.com

[HTTP_STATUS]
# HTTP status codes that indicate a healthy server
# (comma-separated)
healthy_status_codes = 200,201,202,204,301,302,304,307,308
