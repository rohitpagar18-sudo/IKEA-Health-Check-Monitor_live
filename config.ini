# IKEA Health Check Configuration
# ================================

[MONITORING]
# Interval between health checks (in seconds)
# NOTE: Set to 60 seconds (1 minute) for testing. Change to 300 for production (5 minutes)
check_interval = 30

# Quick check interval for failed URLs (in seconds)
quick_check_interval = 30

# Request timeout (in seconds)
request_timeout = 10

# RETRY THRESHOLD: Number of consecutive failures before sending alert email
# When a URL fails, it is retried up to this threshold.
# Email alert is triggered ONLY when consecutive failures reach this threshold (default: 3 retries)
# THRESHOLD LOCATION: This value is checked in HealthCheckMonitor.handle_failure() method
alert_threshold = 2

[LOGGING]
# Directory for log files
log_directory = logs

# Main log file name
log_file = health_check.log

# Alert log file name
alert_log_file = health_check_alerts.log

# Report file name
report_file = health_check_report.json

[EMAIL_ALERTS]
# Enable email notifications (true/false)
enabled = false

# SMTP server configuration
smtp_server = smtp.gmail.com
smtp_port = 587

# Sender email
sender_email = your_email@gmail.com

# Sender email password or app password
sender_password = your_app_password

# Recipient emails (comma-separated)
recipient_emails = admin@ikea.com,ops@ikea.com

[HTTP_STATUS]
# HTTP status codes that indicate a healthy server
# (comma-separated)
healthy_status_codes = 200,201,202,204,301,302,304,307,308
